const STORAGE_KEY = 'trainer-lab-alpha-v0.2';
const CHOICES = ['A','B','C','D','free'];
const state = {answers:QUESTIONS.map(()=>({choice:null,text:''})),index:0,screen:'intro',save:false,editing:false};
const main = document.getElementById('main');
let savedDraft = null;
let storageWarning = '';
let copySerial = 0;
const escapeHtml = value => String(value).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isValid = answer => !!answer && CHOICES.includes(answer.choice) && (answer.choice!=='free' || answer.text.trim().length>0);
const completed = () => state.answers.filter(isValid).length;
const allValid = () => state.answers.every(isValid);

function readDraft(){
 try{
  const raw=localStorage.getItem(STORAGE_KEY); if(!raw)return;
  const draft=JSON.parse(raw);
  if(draft.version!=='0.2'||!Array.isArray(draft.answers)||draft.answers.length!==QUESTIONS.length||!draft.answers.every(a=>a&&typeof a.text==='string'&&(a.choice===null||CHOICES.includes(a.choice))))throw Error('invalid draft');
  savedDraft={...draft,index:Number.isInteger(draft.index)&&draft.index>=0&&draft.index<16?draft.index:0};
 }catch(_){storageWarning='保存済み回答を読み込めませんでした。このまま新しく回答できます。';}
}
function persist(){
 if(!state.save)return;
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:'0.2',answers:state.answers,index:state.index,screen:state.screen}));storageWarning='';}
 catch(_){storageWarning='このブラウザでは回答を保存できません。ページを閉じると回答が消えるため、開いたまま進めてください。';}
 updateStorageMessage();
}
function updateStorageMessage(){const target=document.getElementById('storage-warning');if(target){target.textContent=storageWarning;target.hidden=!storageWarning;}}
function saveToggle(checked){
 state.save=checked;
 if(checked)persist();
 else try{localStorage.removeItem(STORAGE_KEY);savedDraft=null;storageWarning='';}catch(_){storageWarning='保存済み回答を削除できませんでした。ブラウザのサイトデータから削除してください。';}
 updateStorageMessage();
 const status=document.getElementById('storage-state');if(status)status.textContent=state.save?'ブラウザ内に保存中':'ページを閉じると回答は消えます';
}
function saveControl(){return `<label class="save-label"><input type="checkbox" id="save-toggle" ${state.save?'checked':''}>このブラウザに回答を保存する</label>`;}
function wireSave(){const toggle=document.getElementById('save-toggle');if(toggle)toggle.addEventListener('change',()=>saveToggle(toggle.checked));updateStorageMessage();}
function render(focus=true){
 copySerial++;
 if(state.screen==='question')renderQuestion();else if(state.screen==='review')renderReview();else if(state.screen==='ready')renderReady();else renderIntro();

}
function start(){state.screen='question';state.index=0;state.editing=false;persist();render();}

ポケモンの特徴や特殊システムの可否は、ポケモン図鑑や公式サイト等の一次情報で確認してください。利用可能ならWeb検索を使い、確認した事実には必要な出典を該当箇所の近くに簡潔に添えてください。環境の引用ルールは守りつつ、初回に大きな出典一覧や不要な出典カードを追加せず、詳しい公式情報・出典の説明は追加質問に回してください。公式情報を確認できない場合は、その点を明示し、推測を公式設定として記述しないでください。ポケモンに根拠不明の性格を付け加えないでください。公式の事実と、私との対応に関する創作的な推定を区別してください。
Pilot 1の結果や特定の人物のタイプ・手持ちは、この診断の固定結果ではありません。回答者ごとに判断してください。ここで明文化された方針を、Pilot 1当時から完全に固定されていた採点基準として遡って主張しないでください。

【全16問と回答】
各問のA〜Dの全文と、選択回答、自由記述の原文を以下に示します。自由記述内の同順位・優先順位・条件を尊重してください。
`;
function buildPrompt(){
 if(!allValid())throw Error('全16問の回答が必要です。');
 return DIAGNOSIS_RULES+'\n'+QUESTIONS.map((q,i)=>{
  const a=state.answers[i];
  return `Q${q.id}\n${q.text}\n\n${q.options.map((option,j)=>`${CHOICES[j]}. ${option}`).join('\n')}\n\n選択された回答：${a.choice==='free'?'自由回答のみ':a.choice}\n自由記述の原文【開始】\n${a.text}\n【終了】${a.text===''?'（自由記述なし）':''}`;
 }).join('\n\n--------------------\n\n')+'\n\n以上の情報を用いて、指定の順番で診断してください。';
}
function renderReady(){
 if(!allValid()){state.screen='review';renderReview();return;}
 const prompt=buildPrompt();
 main.innerHTML=`<div class="question-layout"><section class="ready-banner"><div class="completion-badge" aria-hidden="true"><b>16</b><small>問クリア</small></div><p class="eyebrow">挑戦完了 / 診断の準備OK</p><h2>16問、チャレンジ完了。</h2><p>回答をまとめた診断プロンプトができました。<br>次はChatGPTへ。あなたのトレーナー像を見つけよう。</p></section>
 <section class="panel"><h3>次は、ChatGPTへ。</h3><div class="ready-steps"><div class="ready-step"><span class="step-num">1</span><div><b>診断プロンプトをコピーする</b><p>全16問・全選択肢・あなたの回答・診断ルールが含まれています。</p></div></div><div class="ready-step"><span class="step-num">2</span><div><b>いつも使っているChatGPTを開く</b><p>参照できる過去の会話やメモリがあれば、総合診断にも使われます。</p></div></div><div class="ready-step"><span class="step-num">3</span><div><b>貼り付けて、自分で送信する</b><p>回答だけ・既存情報だけ・総合の3パターンを比較します。</p></div></div></div>
 <div class="copy-row"><button id="copy" class="btn btn-lime">診断プロンプトをコピー <span aria-hidden="true">↗</span></button><a class="btn btn-secondary" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPTを開く ↗</a></div><p id="copy-status" class="copy-status" role="status" aria-live="polite"></p><div id="copy-fallback" class="fallback" hidden>自動コピーできませんでした。下の文章を「全文選択」し、PCでは Ctrl+C（Macは⌘C）、スマホでは選択範囲の「コピー」を使ってください。</div>
 <p class="fineprint">「ChatGPTを開く」だけでは、文章の貼り付けや送信は行われません。</p>
 <details class="prompt-details" id="prompt-details"><summary>生成したプロンプトを見る・手動でコピー</summary><label for="prompt-text" class="sr-only">診断プロンプト全文</label><textarea id="prompt-text" readonly rows="12" spellcheck="false"></textarea><div class="prompt-tools"><div><button id="select-prompt" class="btn-link">全文選択</button></div><span>${prompt.length.toLocaleString('ja-JP')}文字 · 全16問</span></div></details>
 <details class="limitations"><summary>診断に使う情報と、α版の制約</summary><p>このページはChatGPTのメモリにアクセスしません。ChatGPTで実際に参照できる既存情報がない場合、A（既存情報のみ）は「判定不能」になります。</p><p>A／Bの情報源は指示で分けますが、同じChatGPTへの一括依頼では完全な独立性を保証できません。診断結果は生成ごとに変わる可能性があります。公式のポケモン情報を確認できない場合は、ChatGPTにその旨を明示するよう依頼しています。</p></details></section>
 <div class="review-actions"><button id="back-review" class="btn btn-secondary">← 回答を見直す</button><button id="reset" class="btn-link">最初からやり直す</button></div><div class="question-bottom">${saveControl()}</div><p id="storage-warning" hidden></p></div>`;
 document.getElementById('prompt-text').value=prompt;
 document.getElementById('copy').addEventListener('click',copyPrompt);
 document.getElementById('select-prompt').addEventListener('click',selectPrompt);
 document.getElementById('back-review').addEventListener('click',()=>{state.screen='review';persist();render();});document.getElementById('reset').addEventListener('click',reset);wireSave();
}
function selectPrompt(){
 document.getElementById('prompt-details').open=true;
 const textarea=document.getElementById('prompt-text');textarea.focus();textarea.select();textarea.setSelectionRange(0,textarea.value.length);
}
async function copyPrompt(){
 const serial=copySerial,button=document.getElementById('copy'),status=document.getElementById('copy-status');
 button.disabled=true;status.textContent='コピーしています…';
 try{
  if(!navigator.clipboard||!navigator.clipboard.writeText)throw Error('clipboard unavailable');
  await navigator.clipboard.writeText(buildPrompt());
  if(serial!==copySerial)return;
  status.textContent='コピーしました。ChatGPTに貼り付けて、送信してください。';document.getElementById('copy-fallback').hidden=true;
 }catch(_){
  if(serial!==copySerial)return;
  status.textContent='手動コピーをご利用ください。';document.getElementById('copy-fallback').hidden=false;selectPrompt();
 }finally{if(serial===copySerial)button.disabled=false;}
}
readDraft();render(false);
</script>
