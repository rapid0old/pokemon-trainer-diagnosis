必要に応じて、メガシンカ、Zワザ、ダイマックス、キョダイマックス、テラスタル、その他の公式に存在する特殊要素、または特殊システムなしを選んでください。設定上・ゲーム上、そのポケモンやフォルムが使用可能なものに限定してください。必ず付与する必要はありません。未確認の組み合わせを創作して公式に存在するように記述しないでください。

【結果の出力：結論を先に、理由は短く】
以下の順番を守ってください。詳しい分析は、私が追加で質問した場合に行ってください。
1. トレーナーカード：Cの専門タイプ／地位／相棒／特殊システム／バトルスタイルの一言／キャラクター設定の一言。
2. A/B/Cの診断比較：専門タイプ・地位・本気の手持ち6匹・相棒・特殊システムを簡潔な表などで比較。A/Bで利用した情報源を短く示し、判定不能はそのまま表示。相違の理由も簡潔に。
3. Cのタイプと地位の理由：観察された具体的な傾向を直接説明する。原則「Q3とQ8から…」など、質問番号だけを根拠にした説明は避ける。「予想外の問題が起きたときに原因を整理する姿勢と、他者との信頼を重視する傾向」のように書く。
4. Cの本気の手持ち6匹：全員を以下の統一形式で紹介する。
   ポケモン名｜一言まとめ
   1文目：公式に確認できるポケモンの特徴。
   2文目：その特徴と、回答者に見られた傾向との対応（創作的な解釈であるとわかる表現）。
   パーティー内の役割も一言まとめ等で簡潔に示す。あるものはバトル性能、あるものは図鑑説明、あるものは根拠不明の性格解釈、という不統一は避ける。
5. Cの相棒と特殊システム：信頼関係・相性の理由を短く説明。エースが異なる場合はその違いも明示。
6. Cのバトルスタイル・ジムの特徴や仕掛け：地位に応じた場のテーマやキャラクター設定を短く描写。ジム以外の地位なら役割に合う挑戦の場として示す。
7. Cの対戦前・勝利後のセリフ：両方必須。その人物の価値観やテーマが自然に現れる、その人ならではの言葉を各1つ。
8. Cのタイプと相棒の次点候補：各候補と、第一候補を優先した理由を短く示す。

【公式情報の根拠】
ポケモンの特徴や特殊システムの可否は、ポケモン図鑑や公式サイト等の一次情報で確認してください。利用可能ならWeb検索を使い、根拠となる公式のリンクや出典を該当箇所の近くに示してください。公式情報を確認できない場合は、その点を明示し、推測を公式設定として記述しないでください。ポケモンに根拠不明の性格を付け加えないでください。公式の事実と、私との対応に関する創作的な推定を区別してください。
Pilot 1の結果や特定の人物のタイプ・手持ちは、この診断の固定結果ではありません。回答者ごとに判断してください。v0.2の明文化された方針を、Pilot 1当時から完全に固定されていた採点基準として遡って主張しないでください。

【全16問と回答】
各問のA〜Dの全文と、選択回答、自由記述の原文を以下に示します。自由記述内の同順位・優先順位・条件を尊重してください。
`;
function buildPrompt(){
 if(!allValid())throw Error('全16問の回答が必要です。');
 return DIAGNOSIS_RULES+'\n'+QUESTIONS.map((q,i)=>{
  const a=state.answers[i];
  return `Q${q.id}\n${q.text}\n\n${q.options.map((option,j)=>`${CHOICES[j]}. ${option}`).join('\n')}\n\n選択された回答：${a.choice==='free'?'自由回答のみ':a.choice}\n自由記述の原文【開始】\n${a.text}\n【終了】${a.text===''?'（自由記述なし）':''}`;
 }).join('\n\n--------------------\n\n')+'\n\n以上の情報を用いて、指定の順番で診断してください。';
}

async function copyPrompt(){
 const serial=copySerial,button=document.getElementById('copy'),status=document.getElementById('copy-status');
 button.disabled=true;status.textContent='コピーしています…';
 try{
  if(!navigator.clipboard||!navigator.clipboard.writeText)throw Error('clipboard unavailable');
  await navigator.clipboard.writeText(buildPrompt());
  if(serial!==copySerial)return;
  status.textContent='コピーしました。ChatGPTに貼り付けて、送信してください。';document.getElementById('copy-fallback').hidden=true;
 }catch(_){
  if(serial!==copySerial)return;
  status.textContent='手動コピーをご利用ください。';document.getElementById('copy-fallback').hidden=false;selectPrompt();
 }finally{if(serial===copySerial)button.disabled=false;}
}
